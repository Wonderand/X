<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · X Operations</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-body"><section class="login-card"><div class="eyebrow">X OPERATIONS / TECH EDITORIAL</div><h1>让技术内容<br>持续产生价值。</h1><p class="muted">从可信来源，到经过审核的每一次发布。</p>{% if auth_ready %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>管理员密码<input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary full">进入工作台 →</button></form>{% else %}<div class="notice"><strong>完成本地初始化</strong><p>在项目终端运行下方命令，创建管理员密码后重启服务。</p><code>python -m app.auth init</code></div>{% endif %}<div class="login-footer">来源可追溯 · 内容可审核 · 发布可核对</div></section></body></html>
